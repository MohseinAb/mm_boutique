{% extends 'store/base.html' %}

{% block content %}

<div class="container mt-5">
    <h2>Edit Product</h2>

    <div class="card p-4 mt-3 shadow-sm">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" value="{{ product.name }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Category</label>
                <select name="category" class="form-control" required>
                    {% for category in categories %}
                        <option value="{{ category.id }}" 
                            {% if product.category.id == category.id %}selected{% endif %}>
                            {{ category.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Price</label>
                <input type="number" step="0.01" name="price" value="{{ product.price }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Size</label>
                <input type="text" name="size" value="{{ product.size }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Color</label>
                <input type="text" name="color" value="{{ product.color }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Stock</label>
                <input type="number" name="stock" value="{{ product.stock }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Image</label>
                <input type="file" name="image" class="form-control">
                {% if product.image %}
                    <p class="mt-2">Current: <img src="{{ product.image.url }}" width="100"></p>
                {% endif %}
            </div>

            <button type="submit" class="btn btn-primary">Update Product</button>
            <a href="{% url 'manage_products' %}" class="btn btn-secondary">Cancel</a>

        </form>

    </div>
</div>

{% endblock %}
