{% extends 'store/base.html' %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }

    .login-box {
        background: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }

    .login-box h2 {
        color: #cc0066;
        margin-bottom: 15px;
    }

    .login-box input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #ddd;
        box-sizing: border-box;
    }

    .login-box button {
        background: #ff66b2;
        border: none;
        padding: 12px 20px;
        color: white;
        border-radius: 20px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
        margin-top: 15px;
        transition: 0.3s;
    }

    .login-box button:hover {
        background: #ff1493;
    }

    .register-link {
        color: #cc0066;
        text-decoration: none;
        font-weight: bold;
    }

    .register-link:hover {
        text-decoration: underline;
    }
</style>

<div class="auth-wrapper">
    <div class="login-box">
        <h2>M&M Boutique</h2>
        <h2>Login</h2>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p style="margin-top: 20px; margin-bottom: 5px; color: #777;">No account?</p>
        <a href="{% url 'register' %}" class="register-link">Register here</a>
    </div>
</div>
{% endblock %}
