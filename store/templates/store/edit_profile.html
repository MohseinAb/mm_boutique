{% extends 'store/base.html' %}

{% block content %}

<style>

    .django-form-fields input,
    .django-form-fields textarea {
        display: block;
        width: 100%;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        appearance: none;
        border-radius: 0.5rem; /* Matches rounded-3 */
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .django-form-fields input:focus,
    .django-form-fields textarea:focus {
        border-color: #ff85c1;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(255, 105, 180, 0.25);
    }

    .django-form-fields textarea {
        resize: vertical;
        min-height: 100px;
    }

    .django-form-fields p {
        margin-bottom: 1rem;
    }

    .django-form-fields label {
        font-weight: bold;
        color: #6c757d; /* text-muted */
        font-size: 0.875em; /* small */
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        display: inline-block;
    }
</style>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">

                <div class="bg-light text-center py-4 border-bottom">
                    <h3 class="mb-0 fw-bold text-dark">Edit Profile</h3>
                    <p class="text-muted mb-0">Update your personal details below</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="small text-muted fw-bold">FIRST NAME</label>
                                <input type="text" name="first_name" class="form-control" value="{{ request.user.first_name }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="small text-muted fw-bold">LAST NAME</label>
                                <input type="text" name="last_name" class="form-control" value="{{ request.user.last_name }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted fw-bold">USERNAME</label>
                            <input type="text" name="username" class="form-control" value="{{ username }}">
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted fw-bold">EMAIL</label>
                            <input type="email" name="email" class="form-control" value="{{ email }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted fw-bold">PHONE</label>
                            <input type="text" name="phone" class="form-control" value="{{ form.instance.phone|default_if_none:'' }}">
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted fw-bold">ZIP CODE</label>
                            <input type="text" id="zip_code" name="zip_code" class="form-control" value="{{ form.instance.zip_code|default_if_none:'' }}">
                            <small id="zip-status" class="text-primary"></small>
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted fw-bold">CITY (Auto-filled via API)</label>
                            <input type="text" id="city" name="city" class="form-control" value="{{ form.instance.city|default_if_none:'' }}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted fw-bold">STREET ADDRESS</label>
                            <input type="text" name="street_address" class="form-control" value="{{ form.instance.street_address|default_if_none:'' }}">
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted fw-bold">NEW PASSWORD</label>
                            <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-3">Save Changes</button>
                        <a href="{% url 'profile' %}" class="btn btn-light text-muted fw-bold py-3 rounded-pill border">
                            Cancel
                        </a>
                    </div>

                    </form>
                </div>

            </div>

        </div>
    </div>
</div>

<script>
document.getElementById('zip_code').addEventListener('input', function() {
    const zip = this.value;
    const statusText = document.getElementById('zip-status');
    
    if (zip.length === 4) {
        statusText.innerText = "Fetching city via API...";
        fetch(`http://localhost:5003/api/zip/${zip}`)
            .then(response => {
                if (!response.ok) throw new Error("ZIP not found");
                return response.json();
            })
            .then(data => {
                document.getElementById('city').value = data.city;
                statusText.innerText = "City found successfully!";
                statusText.className = "text-success small";
            })
            .catch(error => {
                document.getElementById('city').value = "";
                statusText.innerText = "Invalid ZIP Code.";
                statusText.className = "text-danger small";
            });
    } else {
        statusText.innerText = "";
        document.getElementById('city').value = "";
    }
});
</script>

{% endblock %}
