{% extends 'store/base.html' %}

{% block content %}
<style>

    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }

    .login-box {
        background: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }

    .login-box h2 {
        color: #cc0066;
        margin-bottom: 20px;
    }

    .login-box input, .login-box textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #ddd;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    .login-box textarea {
        resize: vertical;
    }

    .login-box button {
        background: #ff66b2;
        border: none;
        padding: 12px 20px;
        color: white;
        border-radius: 20px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
        margin-top: 15px;
        transition: 0.3s;
    }

    .login-box button:hover {
        background: #ff1493;
    }

    .login-link {
        display: inline-block;
        margin-top: 15px;
        color: #cc0066;
        text-decoration: none;
    }

    .login-link:hover {
        text-decoration: underline;
    }

    form p {
        text-align: left;
        color: #555;
        margin-bottom: 0;
    }
</style>

<div class="auth-wrapper">
    <div class="login-box">
        <h2>Register</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Account</button>
        </form>

        <a href="{% url 'login' %}" class="login-link">Already have an account? Login here</a>
    </div>
</div>
{% endblock %}
